plugins {
    id "com.android.application"
}

// Version numbers come from version.mk so the APK always matches the engine.
def versionProps = [:]
file("${rootDir}/../version.mk").eachLine { line ->
    def m = (line =~ /^\s*(VER_[A-Z]+)\s*=\s*(.*)$/)
    if (m.matches()) {
        versionProps[m.group(1)] = m.group(2).trim()
    }
}
def verMajor = (versionProps.VER_MAJOR ?: "1") as int
def verMinor = (versionProps.VER_MINOR ?: "0") as int
def verRelease = (versionProps.VER_RELEASE ?: "0") as int
def buildNumber = (project.findProperty("keeperfx.buildNumber") ?: "0") as int

// Version of the port itself: major from gradle.properties, minor counting up
// from the base commit recorded there. See the comment next to those properties.
def portMajor = (project.findProperty("keeperfx.portMajor") ?: "1") as int
def portBaseCommit = project.property("keeperfx.portBaseCommit")
def portBaseMinor = project.property("keeperfx.portBaseMinor") as int
def commitsSinceBase = { ->
    def git = ["git", "-C", "${rootDir}/..", "rev-list", "--count", "--first-parent",
               "${portBaseCommit}..HEAD"].execute()
    def count = git.text.trim()
    return (git.waitFor() == 0) ? (count as int) : -1
}.call()
if (commitsSinceBase < 0) {
    // A source drop without history. Only ever a local build: CI needs the
    // history for the release notes and publishes nothing older than its last.
    logger.warn("No git history to count from, the port version stays at ${portBaseMinor}")
}
// The commit after the base is the first of the count, so that a release commit which
// names its parent as the base comes out as exactly the minor written next to it.
def portVersion = "${portMajor}.${portBaseMinor + Math.max(0, commitsSinceBase - 1)}"
// The KeeperFX build this engine is: the merge base with dkfans/keeperfx, not
// the number of commits in this fork. It becomes VER_BUILD, which is what the
// multiplayer handshake compares - net_versions_match() requires all four
// numbers to be equal, so reporting our own commit count made this build
// incompatible with every KeeperFX in existence, official or not. Falls back
// to the fork count only for a local build, which has no upstream remote.
def knownEngineBuild = (project.findProperty("keeperfx.engineBuild") ?: "0") as int
def engineBuild = (knownEngineBuild > 0) ? knownEngineBuild : buildNumber

def sdlJavaDir = file("${rootDir}/.deps/SDL3/android-project/app/src/main/java")

// The engine and the files in config/ have to match. They ship together on the
// desktop; here the engine is built from source while the data comes from a
// release, so the tree is packaged into the APK and laid over the installation.
def bundledConfigStage = layout.buildDirectory.dir("generated/bundled-config")

android {
    namespace "net.keeperfx.android"
    compileSdk 34
    ndkVersion project.property("keeperfx.ndkVersion")

    defaultConfig {
        applicationId "net.keeperfx.android"
        // Android 9.
        minSdk 28
        targetSdk 34
        versionCode verMajor * 1000000 + verMinor * 10000 + verRelease * 1000 + buildNumber
        // Just the port's own version. Which KeeperFX this engine is has its
        // own line in the launcher and its own place in the log header, so
        // cramming it in here only made the number look like an official build
        // without being comparable to one. versionCode still counts every commit:
        // Android needs it to rise on every build, a merge from upstream making it
        // jump does no harm, and it is never shown to anyone.
        versionName portVersion
        // Picks the alpha patch that belongs to this engine. 0 when not known, not
        // the fallback above: that number would pick some unrelated patch.
        buildConfigField "int", "ENGINE_BUILD", "${knownEngineBuild}"

        ndk {
            abiFilters.addAll(
                project.property("keeperfx.abiFilters").split(",").collect { it.trim() })
        }

        externalNativeBuild {
            cmake {
                // Without a list Gradle builds and packages every library target in
                // the project, EXCLUDE_FROM_ALL or not, which is how the shared zlib
                // nothing links against ended up in the APK. Everything libkeeperfx
                // does link against comes along by itself.
                targets "keeperfx"
                arguments "-DANDROID_STL=c++_shared",
                          "-DBUILD_NUMBER=${engineBuild}",
                          // Left empty on purpose: CMake then builds the suffix
                          // from the one in version.mk, so "unofficial" is
                          // stated in a single place.
                          "-DPACKAGE_SUFFIX=${project.findProperty('keeperfx.packageSuffix') ?: ''}",
                          "-DGIT_REVISION=${project.findProperty('keeperfx.gitRevision') ?: 'unknown'}"
                // The engine is a large C codebase; -O2 keeps the build fast enough
                // while still producing a playable frame rate.
                cFlags "-O2"
                cppFlags "-O2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version project.property("keeperfx.cmakeVersion")
        }
    }

    signingConfigs {
        // Sideload key. It is intentionally committed: an APK has to be signed to
        // be installable at all, and a stable key means CI builds can be updated
        // in place instead of forcing an uninstall. Being public, it also lets anyone
        // sign an APK Android accepts as an update, so what the in-app updater really
        // trusts is TLS to GitHub.
        ci {
            storeFile file("keeperfx-ci.keystore")
            storePassword "keeperfx"
            keyAlias "keeperfx"
            keyPassword "keeperfx"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ci
        }
        release {
            signingConfig signingConfigs.ci
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // commons-compress reaches for java.nio and java.time corners that are
        // not uniformly present across the supported API levels.
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            // SDLActivity and friends are used unmodified from the SDL release
            // that fetch-deps.sh downloads, so no SDL code is vendored here.
            java.srcDirs += sdlJavaDir
            // The engine's own config/ tree, staged under a kfx-config prefix
            // by copyBundledConfig below.
            assets.srcDirs += bundledConfigStage
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        // A call newer than minSdk only fails on a phone nobody here tests on, so it
        // has to stop the release build: lintVitalRelease, part of assembleRelease,
        // looks only at fatal issues. See lint.xml for the one hit that is ignored.
        fatal "NewApi"
    }

    testOptions {
        unitTests {
            // The logic under test logs through android.util.Log, which only
            // exists as a stub off the device.
            returnDefaultValues = true
        }
    }
}

dependencies {
    // FileProvider, so the log can be handed to another app.
    implementation "androidx.core:core:1.13.1"
    // The official release is distributed as a 7z archive; commons-compress
    // reads it and xz supplies the LZMA/LZMA2 codecs it needs.
    implementation "org.apache.commons:commons-compress:1.27.1"
    implementation "org.tukaani:xz:1.10"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.3"

    testImplementation "junit:junit:4.13.2"
    // android.jar only carries stubs of org.json, and the API parsers are worth
    // testing against the real thing.
    testImplementation "org.json:json:20240303"
}

def copyBundledConfig = tasks.register("copyBundledConfig", Copy) {
    description = "Stages the engine's config/ tree as an APK asset"
    from("${rootDir}/../config")
    into(bundledConfigStage.map { it.dir("kfx-config") })
}

// CI runs this script explicitly before the build; wiring it in here as well keeps
// a plain "gradle assembleRelease" working.
def fetchNativeDeps = tasks.register("fetchNativeDeps", Exec) {
    description = "Downloads the pinned native dependency sources"
    workingDir rootDir
    commandLine "bash", "scripts/fetch-deps.sh"
    // It only looks at its stamps when nothing changed, and a new pin has to reach
    // a machine that already has the sources.
    inputs.file("${rootDir}/scripts/fetch-deps.sh")
    outputs.upToDateWhen { sdlJavaDir.exists() }
}

tasks.named("preBuild").configure {
    dependsOn fetchNativeDeps
    dependsOn copyBundledConfig
}

afterEvaluate {
    tasks.matching {
        it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake")
    }.configureEach {
        dependsOn fetchNativeDeps
    }
    tasks.matching { it.name.startsWith("merge") && it.name.contains("Assets") }.configureEach {
        dependsOn copyBundledConfig
    }
}
