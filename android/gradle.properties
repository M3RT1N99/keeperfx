org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Only 64 bit ARM is built by default; every Android device sold since 2019 is
# arm64 and each extra ABI multiplies the native build time.
keeperfx.abiFilters=arm64-v8a

# Pinned so the CI runner and a local checkout use the same toolchain.
keeperfx.ndkVersion=26.3.11579264
keeperfx.cmakeVersion=3.22.1

# Version of the Android port itself, shown after the KeeperFX version it runs
# on: "1.4.0_1.0" is KeeperFX 1.4.0 with port version 1.0. Keeping the two
# apart is the point - the fourth number of a KeeperFX version is its own build
# counter, and reusing that position for ours made this fork look like an
# official alpha build.
#
# The minor counts commits since the baseline, so it rises on its own; the
# baseline is the commit count at which the port version was reset to 1.0.
keeperfx.portMajor=1
keeperfx.portBaseline=5324
