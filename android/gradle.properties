org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Only 64 bit ARM is built by default; every Android device sold since 2019 is
# arm64 and each extra ABI multiplies the native build time.
keeperfx.abiFilters=arm64-v8a

# Pinned so the CI runner and a local checkout use the same toolchain.
keeperfx.ndkVersion=26.3.11579264
keeperfx.cmakeVersion=3.22.1

# Version of the Android port itself, which is all the app's versionName shows: it
# says nothing about the KeeperFX version it runs on. Keeping the two apart is the
# point. The fourth number of a KeeperFX version is its own build counter, and reusing
# that position for ours would make this fork look like an official alpha build.
#
# The first commit on this branch's own line after the base commit is
# portMajor.portBaseMinor, and every later one adds one to the minor. So a commit that
# sets the base to its own parent carries exactly the number it writes here. Only the
# first parent is followed, so merging upstream counts as the one commit it is here,
# however many it brings along. It also needs no upstream remote, and nothing upstream
# does can make it go backwards.
keeperfx.portMajor=1
keeperfx.portBaseCommit=573c43a075b3846f6fca4af9f097070f014d0d4a
keeperfx.portBaseMinor=52

# Which KeeperFX build the engine actually is: the commit count at the merge
# base with dkfans/keeperfx. CI works it out and passes it in; this default only
# applies to a local build, where it is not worth adding a remote for.
# It is what makes the version comparable with an alpha patch, whose own
# version is that same counter - engine 5268 against alpha data 5271 tells you
# at a glance whether the two belong together - and how the launcher asks for
# the patch that fits.
keeperfx.engineBuild=0
