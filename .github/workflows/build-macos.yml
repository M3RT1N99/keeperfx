name: Build macOS arm64

on:
  push:
    branches:
      - master
      - feature/macos-support
    paths:
      - 'src/**'
      - 'campgns/**'
      - 'config/**'
      - 'gfx/**'
      - 'lang/**'
      - 'levels/**'
      - 'multiplayer/**'
      - 'res/**'
      - 'docs/MACOS_ARM64_PORT.md'
      - 'docs/files_required_from_original_dk.txt'
      - 'docs/keeperfx_readme.txt'
      - 'macos.mk'
      - 'package.mk'
      - 'pkg_gfx.mk'
      - 'pkg_lang.mk'
      - 'prebuilds.mk'
      - 'version.mk'
      - 'tools/build_macos_deps.sh'
      - 'tools/make_macos_app.sh'
      - 'tools/make_macos_distribution.sh'
      - 'tools/make_platform_assets.sh'
      - '.github/workflows/build-macos.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'campgns/**'
      - 'config/**'
      - 'gfx/**'
      - 'lang/**'
      - 'levels/**'
      - 'multiplayer/**'
      - 'res/**'
      - 'docs/MACOS_ARM64_PORT.md'
      - 'docs/files_required_from_original_dk.txt'
      - 'docs/keeperfx_readme.txt'
      - 'macos.mk'
      - 'package.mk'
      - 'pkg_gfx.mk'
      - 'pkg_lang.mk'
      - 'prebuilds.mk'
      - 'version.mk'
      - 'tools/build_macos_deps.sh'
      - 'tools/make_macos_app.sh'
      - 'tools/make_macos_distribution.sh'
      - 'tools/make_platform_assets.sh'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assets:
    name: Build platform-neutral game data
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dkfans/setup-cpp@master

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            g++-mingw-w64-i686 \
            libpng16-16t64 \
            7zip

      - name: Cache graphics sources
        uses: actions/cache@v4
        with:
          path: gfx
          key: keeperfx-fxgraphics-${{ hashFiles('prebuilds.mk', 'pkg_gfx.mk') }}

      - name: Build generated data and package files
        run: |
          set -euxo pipefail
          BUILD_NUMBER=$(git rev-list --count HEAD)
          make BUILD_NUMBER="$BUILD_NUMBER" PACKAGE_SUFFIX= pkg-gfx
          make BUILD_NUMBER="$BUILD_NUMBER" PACKAGE_SUFFIX= heavylog DEBUG=1 -k
          make BUILD_NUMBER="$BUILD_NUMBER" PACKAGE_SUFFIX= standard
          make BUILD_NUMBER="$BUILD_NUMBER" PACKAGE_SUFFIX= package

      - name: Assemble platform-neutral assets
        run: |
          set -euxo pipefail
          bash tools/make_platform_assets.sh pkg

      - name: Upload platform-neutral assets
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-platform-assets-${{ github.sha }}
          path: pkg/
          if-no-files-found: error

  build-macos:
    name: Native Apple Silicon build
    runs-on: macos-15
    needs: build-assets

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Homebrew dependencies
        run: |
          set -euxo pipefail
          brew install \
            pkg-config \
            sdl2 sdl2_image sdl2_mixer sdl2_net \
            ffmpeg \
            luajit \
            openal-soft \
            libspng \
            minizip \
            miniupnpc \
            libnatpmp \
            zlib \
            curl \
            dylibbundler

      - name: Cache source-only dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/astronomy
            deps/centijson
            deps/enet6
          key: macos-arm64-deps-${{ hashFiles('tools/build_macos_deps.sh') }}

      - name: Build source-only dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./tools/build_macos_deps.sh

      - name: Build KeeperFX
        run: |
          set -euxo pipefail
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VER_SUFFIX=CI_$(git rev-parse --short=7 HEAD)
          make -f macos.mk \
            BUILD_NUMBER="$BUILD_NUMBER" \
            VER_SUFFIX="$VER_SUFFIX" \
            -j"$(sysctl -n hw.ncpu)"

      - name: Verify native binary
        run: |
          set -euxo pipefail
          file bin/keeperfx
          lipo -archs bin/keeperfx | grep -qw arm64

      - name: Build and verify app bundle
        run: |
          set -euxo pipefail
          ./tools/make_macos_app.sh
          test -f dist/KeeperFX.app/Contents/Resources/fxdata/sounds.cfg
          otool -L dist/KeeperFX.app/Contents/MacOS/keeperfx \
            | grep -q '@executable_path/../libs'
          codesign --verify --verbose=2 dist/KeeperFX.app
          ditto -c -k --keepParent dist/KeeperFX.app dist/KeeperFX.app.zip

      - name: Download platform-neutral assets
        uses: actions/download-artifact@v4
        with:
          name: keeperfx-platform-assets-${{ github.sha }}
          path: macos-assets

      - name: Build and verify complete macOS distribution
        run: |
          set -euxo pipefail
          bash ./tools/make_macos_distribution.sh macos-assets
          test -f dist/KeeperFX-macOS-arm64-complete.zip
          test -d dist/KeeperFX-macOS-arm64/KeeperFX.app
          test -f dist/KeeperFX-macOS-arm64/data/creature.jty
          test -f dist/KeeperFX-macOS-arm64/fxdata/sounds.cfg
          test ! -f dist/KeeperFX-macOS-arm64/data/bluepal.dat

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-macos-arm64-${{ github.sha }}
          path: dist/KeeperFX.app.zip
          if-no-files-found: error

      - name: Upload complete macOS distribution
        uses: actions/upload-artifact@v4
        with:
          name: keeperfx-macos-arm64-complete-${{ github.sha }}
          path: dist/KeeperFX-macOS-arm64-complete.zip
          if-no-files-found: error
