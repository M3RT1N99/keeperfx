name: Build Android

on:
  push:
    branches:
      - 'feature/android-support'
  pull_request:
    types: [ready_for_review, review_requested]
  workflow_dispatch:

jobs:
  build-android:
    name: "Build Android arm64 APK"
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK, NDK and CMake
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platform-tools
          platforms;android-34
          build-tools;34.0.0
          ndk;26.3.11579264
          cmake;3.22.1

    # Runs before the dependency sources are unpacked: the action validates every
    # gradle-wrapper.jar it finds in the workspace, and several of the upstream
    # projects we download ship their own, which we never execute.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Cache native dependency sources
      uses: actions/cache@v4
      with:
        path: android/.deps
        key: android-deps-${{ hashFiles('android/scripts/fetch-deps.sh') }}

    - name: Fetch native dependency sources
      run: bash android/scripts/fetch-deps.sh

    - name: Build APK
      working-directory: android
      run: |
        set -eux
        # Counted over HEAD, not origin/master: the fork's master never moves,
        # so every APK would otherwise carry the same versionCode and the
        # installed build would be impossible to tell apart.
        BUILD_NUMBER=$(git rev-list --count HEAD)
        GIT_REVISION=$(git describe --always)
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
        echo "GIT_REVISION=$GIT_REVISION" >> $GITHUB_ENV
        gradle --no-daemon assembleRelease \
          -Pkeeperfx.buildNumber="$BUILD_NUMBER" \
          -Pkeeperfx.gitRevision="$GIT_REVISION" \
          -Pkeeperfx.packageSuffix="Android_$GIT_REVISION"

    - name: Inspect the APK
      run: |
        set -eux
        APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
        test -n "$APK"
        ls -lh "$APK"
        # Prove the native library really is arm64 and that every shared object
        # the loader needs actually shipped inside the package.
        unzip -l "$APK" | grep 'lib/arm64-v8a/'
        unzip -o -q "$APK" 'lib/arm64-v8a/*' -d apk-check
        file apk-check/lib/arm64-v8a/libkeeperfx.so
        file apk-check/lib/arm64-v8a/libkeeperfx.so | grep -q 'ARM aarch64'
        for lib in libSDL2.so libSDL2_image.so libSDL2_mixer.so libSDL2_net.so libopenal.so libc++_shared.so; do
          test -f "apk-check/lib/arm64-v8a/$lib" || { echo "missing $lib in APK"; exit 1; }
        done
        ARTIFACT_NAME="keeperfx-android-arm64-${GIT_REVISION}"
        echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
        mkdir -p out
        # Stable file name: the in-app updater downloads this exact URL.
        cp "$APK" "out/keeperfx-android-arm64.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: out/*.apk
        if-no-files-found: error

    # A rolling release gives a permanent, login-free download URL. Action
    # artifacts expire after 90 days and cannot be fetched without a GitHub
    # account, so the in-app updater could not use them.
    - name: Publish the rolling development release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eux
        VERSION_NAME=$(grep -E '^VER_MAJOR=' version.mk | cut -d= -f2).$(grep -E '^VER_MINOR=' version.mk | cut -d= -f2).$(grep -E '^VER_RELEASE=' version.mk | cut -d= -f2).${BUILD_NUMBER}
        cat > out/version.json <<JSON
        {
          "versionName": "${VERSION_NAME}",
          "buildNumber": ${BUILD_NUMBER},
          "commit": "${GIT_REVISION}",
          "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/keeperfx-android-arm64.apk"
        }
        JSON
        cat out/version.json

        # Recreated rather than edited so the tag follows the current commit.
        gh release delete android-latest --yes --cleanup-tag || true
        gh release create android-latest \
          out/keeperfx-android-arm64.apk out/version.json \
          --target "${GITHUB_SHA}" \
          --title "KeeperFX for Android ${VERSION_NAME}" \
          --notes "Development build of the \`feature/android-support\` branch.

        | | |
        |---|---|
        | Version | \`${VERSION_NAME}\` |
        | Commit | \`${GIT_REVISION}\` |
        | ABI | \`arm64-v8a\` |
        | Requires | Android 9 (API 28) or newer |

        Install straight over a previous build; game data and settings are kept.
        Play Protect will warn about an unknown developer, which is expected for
        a self signed APK.

        Contains the engine only. Use **Install KeeperFX** in the launcher to
        fetch the game data, then **Import original Dungeon Keeper** for the
        files that must come from the original game."

  # The Android port must not change how the desktop ports build. This job is the
  # regression guard for the shared source files the port touches.
  build-linux-regression:
    name: "Regression: Linux x86_64"
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update system
      run: |
        set -eux
        sudo apt update
        sudo apt install -y \
          build-essential \
          pkg-config \
          curl \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libopenal-dev \
          libluajit-5.1-dev \
          libminizip-dev \
          libnatpmp-dev \
          libspng-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-net-dev \
          libswresample-dev \
          libminiupnpc-dev \
          zlib1g-dev

    - name: Build
      run: |
        set -eux
        BUILD_NUMBER=$(git rev-list --count origin/master)
        make BUILD_NUMBER=$BUILD_NUMBER VER_SUFFIX=AndroidBranchCheck -f linux.mk -j"$(nproc)"
        ls -l bin/keeperfx
