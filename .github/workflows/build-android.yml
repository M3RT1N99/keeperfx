name: Build Android

on:
  push:
    branches:
      - 'feature/android-support'
  pull_request:
    types: [ready_for_review, review_requested]
  workflow_dispatch:

jobs:
  build-android:
    name: "Build Android arm64 APK"
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK, NDK and CMake
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platform-tools
          platforms;android-34
          build-tools;34.0.0
          ndk;26.3.11579264
          cmake;3.22.1

    # Runs before the dependency sources are unpacked: the action validates every
    # gradle-wrapper.jar it finds in the workspace, and several of the upstream
    # projects we download ship their own, which we never execute.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Cache native dependency sources
      uses: actions/cache@v4
      with:
        path: android/.deps
        key: android-deps-${{ hashFiles('android/scripts/fetch-deps.sh') }}

    - name: Fetch native dependency sources
      run: bash android/scripts/fetch-deps.sh

    - name: Build APK
      working-directory: android
      run: |
        set -eux
        # Counted over HEAD, not origin/master: the fork's master never moves,
        # so every APK would otherwise carry the same versionCode and the
        # installed build would be impossible to tell apart.
        BUILD_NUMBER=$(git rev-list --count HEAD)
        GIT_REVISION=$(git describe --always)
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
        echo "GIT_REVISION=$GIT_REVISION" >> $GITHUB_ENV
        gradle --no-daemon assembleRelease \
          -Pkeeperfx.buildNumber="$BUILD_NUMBER" \
          -Pkeeperfx.gitRevision="$GIT_REVISION" \
          -Pkeeperfx.packageSuffix="Android_$GIT_REVISION"

    - name: Inspect the APK
      run: |
        set -eux
        APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
        test -n "$APK"
        ls -lh "$APK"
        # Prove the native library really is arm64 and that every shared object
        # the loader needs actually shipped inside the package.
        unzip -l "$APK" | grep 'lib/arm64-v8a/'
        unzip -o -q "$APK" 'lib/arm64-v8a/*' -d apk-check
        file apk-check/lib/arm64-v8a/libkeeperfx.so
        file apk-check/lib/arm64-v8a/libkeeperfx.so | grep -q 'ARM aarch64'
        for lib in libSDL2.so libSDL2_image.so libSDL2_mixer.so libSDL2_net.so libopenal.so libc++_shared.so; do
          test -f "apk-check/lib/arm64-v8a/$lib" || { echo "missing $lib in APK"; exit 1; }
        done
        ARTIFACT_NAME="keeperfx-android-arm64-${GIT_REVISION}"
        echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
        mkdir -p out
        # Stable file name: the in-app updater downloads this exact URL.
        cp "$APK" "out/keeperfx-android-arm64.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: out/*.apk
        if-no-files-found: error

    # One release per build, tagged with its version, so there is a history to
    # go back through. Action artifacts expire after 90 days and cannot be
    # fetched without a GitHub account; a release is a permanent, login-free URL.
    - name: Publish the release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eux
        VER_MAJOR=$(grep -E '^VER_MAJOR=' version.mk | cut -d= -f2)
        VER_MINOR=$(grep -E '^VER_MINOR=' version.mk | cut -d= -f2)
        VER_RELEASE=$(grep -E '^VER_RELEASE=' version.mk | cut -d= -f2)
        VERSION_NAME="${VER_MAJOR}.${VER_MINOR}.${VER_RELEASE}.${BUILD_NUMBER}"
        TAG="android-v${VERSION_NAME}"

        cat > out/version.json <<JSON
        {
          "versionName": "${VERSION_NAME}",
          "buildNumber": ${BUILD_NUMBER},
          "commit": "${GIT_REVISION}",
          "tag": "${TAG}",
          "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/keeperfx-android-arm64.apk"
        }
        JSON

        # Changelog since the previous Android release. The tags are created by
        # this workflow, so the newest one that is an ancestor is the last build.
        git fetch --tags --quiet || true
        PREVIOUS=$(git tag --list 'android-v*' --sort=-creatordate | grep -v "^${TAG}$" | head -n1 || true)
        if [ -n "$PREVIOUS" ]; then
          RANGE="${PREVIOUS}..HEAD"
          HEADING="Changes since ${PREVIOUS#android-v}"
        else
          RANGE="HEAD~20..HEAD"
          HEADING="Recent changes"
        fi
        # Subject lines only; the bodies explain the why and belong in the log.
        CHANGES=$(git log --no-merges --pretty=format:'- %s' "$RANGE" 2>/dev/null | head -n 40)
        [ -n "$CHANGES" ] || CHANGES="- No source changes"

        {
          echo "Development build of the \`feature/android-support\` branch."
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Version | \`${VERSION_NAME}\` |"
          echo "| Commit | \`${GIT_REVISION}\` |"
          echo "| ABI | \`arm64-v8a\` |"
          echo "| Requires | Android 9 (API 28) or newer |"
          echo
          echo "## ${HEADING}"
          echo
          echo "${CHANGES}"
          echo
          echo "---"
          echo
          echo "Install straight over a previous build; game data and settings are kept."
          echo "Play Protect warns about an unknown developer, which is expected for a"
          echo "self signed APK."
          echo
          echo "Contains the engine only. Use **Check for downloads** in the launcher to"
          echo "fetch the game data and the music, then **Import original Dungeon Keeper**"
          echo "for the files that must come from the original game."
        } > out/notes.md

        # A re-run of the same commit would clash with its own tag.
        gh release delete "$TAG" --yes --cleanup-tag || true
        gh release create "$TAG" \
          out/keeperfx-android-arm64.apk out/version.json \
          --target "${GITHUB_SHA}" \
          --title "KeeperFX for Android ${VERSION_NAME}" \
          --notes-file out/notes.md

        # Builds up to 1.4.0.5289 look for a fixed android-latest URL rather than
        # asking the API, so that tag has to keep moving or those installs could
        # never update themselves again. It is marked as a prerelease, which
        # keeps /releases/latest returning the newest android-v* instead of this
        # one - that is what newer builds follow.
        gh release delete android-latest --yes --cleanup-tag || true
        gh release create android-latest \
          out/keeperfx-android-arm64.apk out/version.json \
          --target "${GITHUB_SHA}" \
          --prerelease \
          --title "KeeperFX for Android ${VERSION_NAME} (compatibility pointer)" \
          --notes "Always the same build as the newest \`android-v*\` release, kept
        so that app versions up to 1.4.0.5289 can still find their update. It is
        flagged as a prerelease so it never shadows the real one.

        See [${TAG}](../../releases/tag/${TAG}) for the changelog."

  # The Android port must not change how the desktop ports build. This job is the
  # regression guard for the shared source files the port touches.
  build-linux-regression:
    name: "Regression: Linux x86_64"
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update system
      run: |
        set -eux
        sudo apt update
        sudo apt install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          curl \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libopenal-dev \
          libluajit-5.1-dev \
          libminizip-dev \
          libnatpmp-dev \
          libspng-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-net-dev \
          libswresample-dev \
          libminiupnpc-dev \
          libssl-dev \
          libzstd-dev \
          zlib1g-dev

    - name: Build
      run: |
        set -eux
        BUILD_NUMBER=$(git rev-list --count HEAD)
        # Same recipe as upstream's own prototype workflow; linux.mk is gone.
        cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_NUMBER=$BUILD_NUMBER -DPACKAGE_SUFFIX=AndroidBranchCheck
        cmake --build out --target keeperfx -j"$(nproc)"
        ls -l out/keeperfx
